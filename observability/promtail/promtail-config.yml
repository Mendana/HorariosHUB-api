server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Backend: emite logs en JSON (LOG_FORMAT=json), los parseamos para
  # sacar labels útiles (level) y quedarnos con el mensaje.
  #
  # Importante: el filtrado de contenedores se hace en `filters` (a nivel de
  # la Docker API), no con `action: keep` en relabel_configs. Promtail no
  # aplica el keep/drop de relabel_configs antes de empezar a leer logs de un
  # contenedor descubierto por docker_sd_configs, así que un contenedor que no
  # nos interesa igualmente se intenta leer, solo que sin labels, y Loki
  # rechaza el push (error "at least one label pair is required per stream").
  - job_name: horarioshub-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
          - name: label
            values: ["com.docker.compose.service=backend"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: timestamp
            message: fields.message
            target: target
      - labels:
          level:
          target:
      - timestamp:
          source: ts
          format: RFC3339Nano

  # Resto de contenedores del proyecto (db, scraper): logs en crudo, sin parseo.
  - job_name: horarioshub-otros
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
          - name: label
            values:
              - "com.docker.compose.service=db"
              - "com.docker.compose.service=scraper"
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
